databaseChangeLog:
  - changeSet:
      id: 01-init-schema
      author: antigravity
      changes:
        - createTable:
            tableName: auths
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false

        - createTable:
            tableName: stores
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: currency
                  type: varchar(10)
              - column:
                  name: minimum_order_quantity
                  type: int
              - column:
                  name: free_shipping_threshold
                  type: decimal(19, 2)
              - column:
                  name: contact_email
                  type: varchar(255)
              - column:
                  name: contact_phone
                  type: varchar(50)

        - createTable:
            tableName: perfumes
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: scent_profile
                  type: varchar(255)
              - column:
                  name: price
                  type: decimal(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: stock
                  type: int
                  constraints:
                    nullable: false

        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: decimal(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: customer_email
                  type: varchar(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: order_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: perfume_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: price_at_purchase
                  type: decimal(19, 2)
                  constraints:
                    nullable: false

        - createTable:
            tableName: b2b_quotes
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: customer_email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: company_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: decimal(19, 2)
              - column:
                  name: custom_terms
                  type: varchar(255)

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_items_order

        - createTable:
            tableName: contact_messages
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: sender_email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: message_body
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: replied
                  type: boolean
                  constraints:
                    nullable: false

        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
              - column:
                  name: admin_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: resource
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false
