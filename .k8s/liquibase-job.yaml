apiVersion: batch/v1
kind: Job
metadata:
  name: liquibase-migration
spec:
  template:
    spec:
      containers:
      - name: liquibase
        # In a real environment, this would be pushed to a registry, e.g., myregistry/ruml-liquibase:latest
        image: ruml-liquibase:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
      restartPolicy: OnFailure
