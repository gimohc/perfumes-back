name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B clean verify
      
    - name: Build Backend Docker Image
      run: docker build -t ruml-backend:latest .
      
    - name: Build Liquibase Docker Image
      run: docker build -f Dockerfile.liquibase -t ruml-liquibase:latest .
